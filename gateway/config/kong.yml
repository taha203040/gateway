_format_version: "3.0"
_transform: true

# ─────────────────────────────────────────
# Services
# ─────────────────────────────────────────
services:
  - name: auth-service
    url: http://auth-svc:3000
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [auth]

  - name: inventory-service
    url: http://inventory-svc:3001
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [inventory]

  - name: order-service
    url: http://order-svc:3002
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [order]

# ─────────────────────────────────────────
# Routes
# ─────────────────────────────────────────
routes:
  # Auth — public routes (no JWT plugin)
  - name: auth-login
    service: auth-service
    paths: [/auth/login]
    methods: [POST]
    strip_path: false
    tags: [auth, public]
 
  - name: auth-refresh
    service: auth-service
    paths: [/auth/refresh]
    methods: [POST]
    strip_path: false
    tags: [auth, public]
 
  - name: auth-logout
    service: auth-service
    paths: [/auth/logout]
    methods: [POST]
    strip_path: false
    tags: [auth, protected]
  - name: inventory-list
    service: inventory-service
    paths: [/items]
    methods: [GET]
    strip_path: false
    tags: [inventory, protected]
 
  - name: inventory-create
    service: inventory-service
    paths: [/items]
    methods: [POST]
    strip_path: false
    tags: [inventory, protected]
 
  - name: inventory-item
    service: inventory-service
    paths: [/items/{id}]
    methods: [GET, PATCH, DELETE]
    strip_path: false
    tags: [inventory, protected]
  - name: inventory-stock
    service: inventory-service
    paths: [~/items/:[^/]+/stock]
    methods: [PATCH]
    strip_path: false
    tags: [inventory, protected]
 
  # Order — protected routes
  - name: order-create
    service: order-service
    paths: [/orders]
    methods: [POST]
    strip_path: false
    tags: [order, protected]
 
  - name: order-list
    service: order-service
    paths: [/orders]
    methods: [GET]
    strip_path: false
    tags: [order, protected]
 
  - name: order-item
    service: order-service
    paths: [~/orders/[^/]+$]
    methods: [GET, PATCH, DELETE]
    strip_path: false
    tags: [order, protected]