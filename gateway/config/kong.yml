_format_version: "3.0"

services:
  - name: frontend-service
    url: http://host.docker.internal:5173
    routes:
      - name: frontend-route
        paths:
          - /
        strip_path: false
    plugins:
      - name: jwt
        enabled: false

  - name: auth-service
    url: http://host.docker.internal:3000
    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: true
    plugins:
      - name: jwt
        enabled: false

  - name: checkout-service
    url: http://host.docker.internal:4000
    routes:
      - name: checkout-route
        paths:
          - /api/checkout
        strip_path: true
    plugins:
      - name: jwt
        enabled: true
        config:
          secret_is_base64: false
          claims_to_verify:
            - exp
          maximum_expiration: 86400
          key_claim_name: "iss"
          header_names: ["Authorization"]
          anonymous: null

  - name: my-inventory
    url: http://host.docker.internal:5000
    routes:
      - name: inventory-route
        paths:
          - /api/inventory
        strip_path: true
    plugins:
      - name: jwt
        enabled: true
        config:
          secret_is_base64: false
          claims_to_verify:
            - exp
          maximum_expiration: 86400
          key_claim_name: "iss"
          header_names: ["Authorization"]
          anonymous: null
      - name: acl
        enabled: true
        config:
          allow:
            - ADMIN
          hide_groups_header: true

  - name: my-orders
    url: http://host.docker.internal:5001
    routes:
      - name: orders-route
        paths:
          - /api/orders
        strip_path: true
    plugins:
      - name: jwt
        enabled: true
        config:
          secret_is_base64: false
          claims_to_verify:
            - exp
          maximum_expiration: 86400
          key_claim_name: "iss"
          header_names: ["Authorization"]
          anonymous: null
      - name: acl
        enabled: true
        config:
          allow:
            - ADMIN
            - WEB
          hide_groups_header: true

consumers:
  - username: admin-consumer
    jwt_secrets:
      - algorithm: HS256
        key: https://auth.myapp.com/admin
        secret: YOUR_JWT_SIGNING_SECRET
    acls:
      - group: ADMIN

  - username: user-web-consumer
    jwt_secrets:
      - algorithm: HS256
        key: https://auth.myapp.com/user/web
        secret: YOUR_JWT_SIGNING_SECRET
    acls:
      - group: USER
      - group: WEB

  - username: user-mobile-consumer
    jwt_secrets:
      - algorithm: HS256
        key: https://auth.myapp.com/user/mobile
        secret: YOUR_JWT_SIGNING_SECRET
    acls:
      - group: USER
      - group: MOBILE