_format_version: "3.0"

services:

  - name: auth-service
  #  url: http://localhost:3000
    url: http://host.docker.internal:3000
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [auth]
    routes:
      - name: auth-register
        paths: [/auth/signup]
        methods: [POST,OPTIONS]
        strip_path: false
        tags: [auth, public]

      - name: auth-login
        paths: [/auth/login]
        methods: [POST,OPTIONS]
        strip_path: false
        tags: [auth, public]

      - name: auth-refresh
        paths: [/auth/refresh]
        methods: [POST,OPTIONS]
        strip_path: false
        tags: [auth, public]

      - name: auth-logout
        paths: [/auth/logout]
        methods: [POST,OPTIONS]
        strip_path: false
        tags: [auth, protected]

      - name: auth-verify
        paths: [/auth/verify]
        methods: [GET]
        strip_path: false
        tags: [auth, protected]

  - name: inventory-service
    url: http://host.docker.internal:4100
   # url: http://localhost:4100
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [inventory]
    routes:
      - name: inventory-list
        paths: [/items]
        methods: [GET]
        strip_path: false
        tags: [inventory, protected]

      - name: inventory-create
        paths: [/items]
        methods: [POST]
        strip_path: false
        tags: [inventory, protected]

      - name: inventory-stock
        paths: ["~/items/[^/]+/stock"]
        methods: [PATCH,POST,DELETE]
        strip_path: false
        tags: [inventory, protected]

      - name: inventory-item
        paths: ["~/items/[^/]+$"]
#        methods: [get, patch, delete]
        methods: [GET]
        strip_path: false
        tags: [inventory, public]

  - name: order-service
   # url: http://localhost:4000
    url: http://host.docker.internal:4000
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    tags: [order]
    routes:
      - name: order-create
        paths: [/api/orders]
        methods: [POST,OPTIONS]
        strip_path: false
        tags: [order, protected]

      - name: order-list
        paths: [/api/orders]
        methods: [GET,OPTIONS]
        strip_path: false
        tags: [order, protected]

      - name: order-item
        paths: ["~/api/orders/[^/]+$"]
        methods: [GET, DELETE,OPTIONS]
        strip_path: false
        tags: [order, protected]
      
      - name: order-pay
        paths: ["~/api/orders/[^/]+/pay$"]
        methods: [PATCH]
        strip_path: false
        tags: [order, protected]
      - name: order-deliver
        paths: ["~/api/orders/[^/]+/deliver$"]
        methods: [PATCH]
        strip_path: false
        tags: [order, protected]
      - name: order-cancel
        paths: ["~/api/orders/[^/]+/cancel$"]
        methods: [PATCH]
        strip_path: false
        tags: [order, protected]
# ─────────────────────────────────────────
# Consumers
# No consumer groups — rate limiting is- name: order-service
  # url: http://localhost:4000
# applied directly per consumer instead.
# ─────────────────────────────────────────
consumers:
  - username: free-tier
    tags: [tier-free]
    jwt_secrets:
      - key: free-tier-issuer
        algorithm: HS256
        secret: "r4nd0mH5-256-K3y!X9q7Lp2vB8wM4nC1jF5tY6zA3sD0eRgUkHo"

  - username: paid-tier
    tags: [tier-paid]
    jwt_secrets:
      - key: paid-tier-issuer
        algorithm: HS256
        secret: "r4nd0mH5-256-K3y!X9q7Lp2vB8wM4nC1jF5tY6zA3sD0eRgUkHo"
  - username: auth-service
    custom_id: auth-service
    jwt_secrets:
      - key: auth-service          # Must match the JWT "iss" claim
        algorithm: HS256
        secret: "A3b7cD9eF1gH2iJ4kL6mN8oP0qR5sT7uV9wX2yZ4"
 #:w─────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - http://host.docker.internal:5173
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
  - name: request-transformer
    route: inventory-create
    config:
      add:
        headers:
          - "X-Consumer-Role: admin"

  - name: request-transformer
    route: inventory-item
    config:
      add:
        headers:
          - "X-Consumer-Role: admin"
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Gateway: kong"
          - "X-API-Version: 1.0"
      remove:
        headers:
          - Server          # don't leak upstream server info
          - X-Powered-By    # don't leak Express/Node info
 
  # ─────────────────────────────────────────
  # Response Transformer — 401 Unauthorized
  # Kong's default 401 body is plain text.
  # Replace it with your standard envelope.
  #
  # Scoped to each protected route so we
  # can set the correct route name in body.
  # ─────────────────────────────────────────
 
  # inventory routes — 401 body

  # - name: response-transformer-advanced
  #   config:
  #     replace:
  #       body: '{"error":"Unauthorized","code":401,"hint":"Include a valid Bearer token in the Authorization header"}'
  #       headers:
  #         - "Content-Type: application/json"
  #       if_status:
  #         - "401"
  #         - "403"
  #         - "429"
#  - name: http-log
 #   config:
  #    http_endpoint: http://log-collector:4000/logs
   #   method: POST
    #  content_type: application/json
     # timeout: 3000       # ms — don't let slow collector stall Kong
      # keepalive: 60000    # reuse HTTP connection for 60s
      #flush_timeout: 2    # seconds before flushing buffered logs
      # retry_count: 2      # retry on failure before dropping
     # queue:
      #  max_batch_size: 100      # send up to 100 log entries per POST
       # max_coalescing_delay: 1  # wait up to 1s to fill a batch
       # max_entries: 10000       # buffer up to 10k entries in memory
 
  - name: correlation-id
    config:
      header_name: X-Correlation-Id    # injected on every request + response
      generator: uuid                  # format: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      echo_downstream: true       
  # ── Rate limiting — global IP ceiling ─
  # Catches unauthenticated (anon) traffic
  # and acts as a hard ceiling for everyone.
  - name: rate-limiting
    config:
      minute: 20
      policy: redis
      redis:
        host: redis
        port: 6379
        timeout: 2000
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

  # ── Rate limiting — free-tier consumer ─
  # Scoped directly to the consumer.
  # Overrides the global plugin for this
  # consumer — Kong uses the most specific
  # scope that matches.
  - name: rate-limiting
    consumer: free-tier
    config:
      minute: 100
      policy: redis
      redis:
        host: redis
        port: 6379
        timeout: 2000
      limit_by: consumer
      fault_tolerant: true
      hide_client_headers: false

  # ── Rate limiting — paid-tier consumer ─
  - name: rate-limiting
    consumer: paid-tier
    config:
      minute: 500
      policy: redis
      redis:
        host: redis
        port: 6379
        timeout: 2000
      limit_by: consumer
      fault_tolerant: true
      hide_client_headers: false

  # ── Key Auth — inventory-stock only ───
  - name: key-auth
    route: inventory-stock
    config:
      key_names:
        - X-API-Key
      hide_credentials: true
      anonymous: ~

  # ── Request Transformer — mark internal calls
  - name: request-transformer
    route: inventory-stock
    config:
      add:
        headers:
          - "X-Internal-Call: true"

  # ── JWT — auth protected routes ───────
  - name: jwt
    route: auth-logout
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      cookie_names: []
      header_names: [Authorization]
      anonymous: ~

  - name: jwt
    route: auth-verify
    config:
      claims_to_verify: [exp]
      key_claim_name: iss
      cookie_names: []
      header_names: [Authorization]
      anonymous: ~

