_format_version: "3.0"

services:

  # =========================
  # FRONTEND
  # =========================
  - name: frontend-service
    url: http://host.docker.internal:5173

    routes:
      - name: frontend-route
        paths:
          - /
        strip_path: false

  # =========================
  # AUTH SERVICE
  # =========================
  - name: auth-service
    url: http://host.docker.internal:3000

    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: true

  # =========================
  # CHECKOUT SERVICE
  # =========================
  - name: checkout-service
    url: http://host.docker.internal:4000

    routes:
      - name: checkout-route
        paths:
          - /api/checkout
        strip_path: true
# Usage: Save this as kong.yml (or declarative config) and apply with:
# curl -i -X POST http://localhost:8001/config \
#   -H "Content-Type: application/json" \
#   -d @kong.yml
# Or run Kong with: KONG_DATABASE=off kong start --conf kong.conf
# Ensure Kong Gateway or a compatible API gateway is running.
