services:
  # log-collector:
  #   build:
  #     context: ./log-collector
  #     dockerfile: Dockerfile
  #   container_name: log-collector
  #   restart: unless-stopped
  #   ports:
  #     - "4000:4000"
  #   networks:
  #     - gateway-net
 
  kong:
    build:
      context: ./gateway
      dockerfile: Dockerfile.dev
      extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./gateway/config:/usr/local/kong/declarative"
      - "./gateway/logs/file.log:/file.log"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/declarative/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001, 0.0.0.0:8444 ssl
      - KONG_LOG_LEVEL=debug
    ports:
        - "8000:8000/tcp"
        - "8001:8001/tcp"
  auth-service:
    container_name: auth
    build: 
      context : ./auth
      dockerfile: Dockerfile.dev
    depends_on :
      - mongo-auth
    # image: auth
    ports:
      - "3000:3000"
    # env_file: ./auth/.env
    develop:
      watch:
        - path: ./auth/package.*.json
          target: ./app
          action: rebuild
        - path: ./auth
          target: /app
          action: sync
  checkout-service:
    container_name: checkout
    build: 
      context:  ./checkout
      dockerfile: Dockerfile.dev
    depends_on :
      -  mongodb-checkout
    # image: checkout
    ports:
      - "2000:2000"         # NOT exposed to host, only nginx can reach it
    # env_file: ./checkout/.env
    develop:
      watch:
        - path: ./checkout/package.*.json
          target: ./app
          action: rebuild
        - path: ./checkout
          target: /app
          action: sync
  mongo-auth:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_auth_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1234

  mongodb-checkout:
    image: mongo:latest
    container_name: mongodb-checkout
    ports:
      - "27018:27017"
    volumes:
      - mongodb_checkout_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1234

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ./frontend/package.*.json
          target: /app
          action: rebuild
        - path: ./frontend
          target: /app
          action: sync
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
  mongodb_auth_data:
  mongodb_checkout_data:
